<title>Motif</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Layout: one phone-width column; header with logo and actions, a bottom tab bar, flat cards; sheets rise from the bottom. Design system in DESIGN.md. The app sets its own theme (Forest by default), so the viewer's light/dark setting is not followed on purpose. */
:root{
  --bg:#0f1712;--surface:#16201a;--surface-2:#1d2a22;--line:#26352b;--ink:#e8efe6;--ink-2:#a3b3a3;--ink-3:#7a8c7d;
  --accent:#9bcf74;--on-accent:#0d150e;--danger:#f0927a;--on-danger:#1a0e0a;--knob:#f2f6ef;color-scheme:dark;
  --accent-soft:color-mix(in srgb,var(--accent) 14%,var(--surface));--miss:var(--ink-3);
  --shadow-float:0 12px 32px -12px rgba(0,0,0,.55);--scrim:rgba(0,0,0,.55);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --t-xs:600 12px/16px var(--f-body);--t-sm:400 13px/18px var(--f-body);--t-md:400 15px/22px var(--f-body);--t-lg:600 17px/24px var(--f-body);
  --t-xl:600 20px/26px var(--f-display);--t-2xl:600 24px/30px var(--f-display);--t-count:600 22px/1 var(--f-display);--t-num:600 52px/1 var(--f-display);
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:32px;--s8:48px;
  --r-xs:4px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:24px;
  --i-sm:16px;--i-md:20px;--press:scale(.98);
  --h-sm:36px;--h-md:44px;--h-lg:52px;
  --fast:120ms;--base:200ms;--slow:280ms;--ease:cubic-bezier(.2,.7,.2,1);
  --tabbar:calc(60px + env(safe-area-inset-bottom,0px));
}
:root[data-ui="forest"]{--bg:#0f1712;--surface:#16201a;--surface-2:#1d2a22;--line:#26352b;--ink:#e8efe6;--ink-2:#a3b3a3;--ink-3:#7a8c7d;--accent:#9bcf74;--on-accent:#0d150e;--danger:#f0927a;--on-danger:#1a0e0a;--knob:#f2f6ef;--scrim:rgba(0,0,0,.55);color-scheme:dark}
:root[data-ui="moss"]{--bg:#eef1e9;--surface:#fbfcf8;--surface-2:#e7ece0;--line:#d7ddcd;--ink:#18251b;--ink-2:#55645a;--ink-3:#6b786c;--accent:#3f6f2c;--on-accent:#ffffff;--danger:#b23b28;--on-danger:#ffffff;--knob:#ffffff;--scrim:rgba(20,30,22,.4);color-scheme:light}
:root[data-ui="midnight"]{--bg:#0d1119;--surface:#141a25;--surface-2:#1b2230;--line:#252d3d;--ink:#e6e9f2;--ink-2:#a0a8bc;--ink-3:#757e96;--accent:#93b1ff;--on-accent:#0b1020;--danger:#ff8c7c;--on-danger:#1a0c0a;--knob:#f0f2f8;--scrim:rgba(0,0,0,.55);color-scheme:dark}
:root[data-ui="ember"]{--bg:#16110e;--surface:#1e1814;--surface-2:#27201a;--line:#33291f;--ink:#f2e9e0;--ink-2:#b9a797;--ink-3:#8c7968;--accent:#eda26a;--on-accent:#1a1008;--danger:#ff8c7c;--on-danger:#1a0c0a;--knob:#f7efe7;--scrim:rgba(0,0,0,.55);color-scheme:dark}
:root[data-ui="sand"]{--bg:#f1ede4;--surface:#fcfaf5;--surface-2:#ebe5d8;--line:#ddd5c4;--ink:#29241a;--ink-2:#675d4b;--ink-3:#837863;--accent:#5c6b25;--on-accent:#ffffff;--danger:#b23b28;--on-danger:#ffffff;--knob:#ffffff;--scrim:rgba(40,32,20,.4);color-scheme:light}
:root[data-ui="ocean"]{--bg:#eaf1f2;--surface:#fafcfc;--surface-2:#e0eaec;--line:#cddcdf;--ink:#13292e;--ink-2:#4c666b;--ink-3:#6a8186;--accent:#1b6676;--on-accent:#ffffff;--danger:#b23b28;--on-danger:#ffffff;--knob:#ffffff;--scrim:rgba(15,35,40,.4);color-scheme:light}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:var(--t-md);-webkit-font-smoothing:antialiased;min-height:100%;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
svg[stroke="currentColor"]{stroke-width:1.75}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
img{display:block}
.wrap{width:100%;max-width:600px;margin:0 auto;padding-left:max(var(--s4),env(safe-area-inset-left,0px));padding-right:max(var(--s4),env(safe-area-inset-right,0px))}
.btn,.icon-btn,.tile,.card,.mini,.preset,.ib,.theme-card,.seg button,.days button,.tabbar button,.tpl,.cd,.stepper button,.fab,.me-btn,.pmain,.fhead,.sw{transition:transform var(--fast) var(--ease),background-color var(--base) var(--ease),border-color var(--base) var(--ease),color var(--base) var(--ease),box-shadow var(--base) var(--ease)}
.btn:active,.icon-btn:active,.tile:active,.mini:active,.preset:active,.ib:active,.theme-card:active,.seg button:active,.days button:active,.cd:active,.stepper button:active,.fab:active,.me-btn:active,.sw:active{transform:var(--press)}

/* ---------- Header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);height:60px}
.brand{display:flex;align-items:center;gap:10px}
.mark{flex:none;color:var(--ink)}
.mark .star{fill:var(--accent)}
.brand h1{font:600 20px/1 var(--f-display);letter-spacing:-.01em}
.top-actions{display:flex;align-items:center;gap:var(--s2)}
.icon-btn{width:var(--h-sm);height:var(--h-sm);border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.icon-btn svg{width:var(--i-md);height:var(--i-md)}
.icon-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.icon-btn:disabled{opacity:.4;cursor:default}
.icon-btn.sm{width:var(--h-sm);height:var(--h-sm);border-radius:var(--r-sm)}
.fab{display:inline-flex;align-items:center;gap:6px;height:var(--h-sm);padding:0 var(--s3) 0 10px;border-radius:var(--r-md);border:1px solid var(--accent);background:transparent;color:var(--accent);font:var(--t-xs);font-size:14px;cursor:pointer}
.fab svg{width:var(--i-sm);height:var(--i-sm)}
.me-btn{padding:0;border:none;background:none;border-radius:50%;cursor:pointer;flex:none}
.me-btn .av{width:var(--h-sm);height:var(--h-sm);font-size:14px}
@media (hover:hover){.icon-btn:hover,.btn:not(.primary):not(.danger):hover{background:var(--surface-2)}.fab:hover{background:var(--accent-soft)}}

/* ---------- Tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar button{position:relative;flex:1;max-width:220px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);border:none;background:none;color:var(--ink-3);font:var(--t-xs);cursor:pointer}
.tabbar button svg{width:var(--i-md);height:var(--i-md)}
.tabbar button[aria-selected="true"]{color:var(--ink)}
.tabbar button[aria-selected="true"]::before{content:"";position:absolute;top:-1px;left:50%;width:28px;height:2px;margin-left:-14px;border-radius:0 0 2px 2px;background:var(--accent)}

/* ---------- Screen ---------- */
main.wrap{padding-top:var(--s5);padding-bottom:calc(var(--tabbar) + var(--s7));display:flex;flex-direction:column;gap:var(--s4)}
main.enter #list,main.enter #summary,main.enter #empty{animation:enter var(--base) var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}}
.summary{display:flex;flex-direction:column;gap:var(--s1)}
.eyebrow{font:var(--t-xs);color:var(--ink-2)}
.headline{font:var(--t-2xl);letter-spacing:-.01em}
.sub{font:var(--t-sm);color:var(--ink-2)}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3) var(--s4);font:var(--t-sm)}
.reminder{display:flex;align-items:center;gap:var(--s3);min-height:var(--h-lg);padding:var(--s2) var(--s2) var(--s2) var(--s4);margin-bottom:var(--s3);border-radius:var(--r-md);background:var(--accent-soft);font:var(--t-md);font-weight:600}
.reminder svg{flex:none;width:var(--i-md);height:var(--i-md);color:var(--accent)}
.reminder span{flex:1}
.reorder-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s2) var(--s2) var(--s2) var(--s4);margin-bottom:var(--s3);border-radius:var(--r-md);border:1px dashed var(--ink-3);font:var(--t-sm)}
.grp{font:var(--t-xs);color:var(--ink-2);margin:var(--s6) 0 var(--s3)}
#list>.group:first-child .grp,#list>.grp:first-child{margin-top:0}

/* ---------- Streak tiles ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s5) var(--s3)}
@media (min-width:540px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile,.card,.mini{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.tile{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;border:none;border-radius:var(--r-md);background:none;color:var(--ink);cursor:pointer;min-width:0}
.tile .media{aspect-ratio:4/3}
.tile .meta{color:var(--ink-3)}
.tile.is-done .meta{color:var(--ink-2)}
.media{position:relative;display:block;aspect-ratio:1;border-radius:var(--r-md);background:color-mix(in srgb,var(--hc) 26%,var(--surface));overflow:hidden}
.media img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.glyph{position:absolute;inset:0;display:grid;place-items:center;font:400 40px/1 var(--f-display)}
.media .tile-streak{position:absolute;left:var(--s2);bottom:var(--s2);z-index:1;display:inline-flex;align-items:baseline;gap:4px;height:28px;padding:0 var(--s2);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);line-height:28px}
.media .tile-streak b{font:600 15px/28px var(--f-display);font-variant-numeric:tabular-nums}
.media .tile-streak small{font:var(--t-xs);color:var(--ink-2)}
.badge{position:absolute;top:var(--s2);right:var(--s2);z-index:1;display:inline-flex;align-items:center;gap:3px;min-width:24px;height:24px;padding:0 var(--s1);justify-content:center;border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font:var(--t-xs);font-variant-numeric:tabular-nums}
.badge.on{background:var(--hc);color:var(--hc-on)}
.badge svg{width:var(--i-sm);height:var(--i-sm)}
.tile-body{display:flex;flex-direction:column;gap:2px;padding-top:var(--s2);min-width:0}
.tile-count{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;max-width:100%}
.tile-body .tile-streak{display:inline-flex;align-items:baseline;gap:var(--s1);flex:none}
.tile-body .tile-streak b{font:var(--t-count);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile-body .tile-streak small{font:var(--t-xs);color:var(--ink-2)}
.tile-count .meta{max-width:100%}
.nm{font:var(--t-md);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font:var(--t-sm);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .strip{margin-top:var(--s2)}
.tile .d em{display:none}
.burst{position:absolute;left:50%;top:50%;z-index:3;height:28px;padding:0 var(--s3);border-radius:var(--r-sm);display:grid;place-items:center;background:var(--surface);color:var(--ink);font:600 15px/28px var(--f-display);pointer-events:none;transform:translate(-50%,-50%);animation:burst .6s var(--ease) forwards}
.card .burst{left:auto;right:var(--s2)}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-30%)}20%{opacity:1;transform:translate(-50%,-50%)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-110%)}}
@keyframes checkin{from{opacity:0;transform:scale(.7)}}
.done-now .badge.on,.done-now .today.on{animation:checkin .24s var(--ease)}

/* ---------- Streak rows ---------- */
.cards{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.card{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto auto;align-items:center;gap:var(--s3);width:100%;min-height:72px;text-align:left;padding:var(--s3) var(--s4);background:none;border:none;border-radius:0;color:var(--ink);cursor:pointer}
.card+.card{border-top:1px solid var(--line)}
button.card:active{background:var(--surface-2)}
@media (hover:hover){button.card:hover{background:color-mix(in srgb,var(--surface-2) 50%,var(--surface))}}
div.card{cursor:default}
.thumb{position:relative;width:48px;height:48px;border-radius:var(--r-md);overflow:hidden;display:grid;place-items:center;background:color-mix(in srgb,var(--hc) 26%,var(--surface));flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.thumb .glyph{position:static;font-size:24px}
.txt{display:flex;flex-direction:column;min-width:0;gap:2px}
.streak{display:flex;flex-direction:column;align-items:flex-end;min-width:32px}
.streak b{font:var(--t-count);font-variant-numeric:tabular-nums}
.streak small{font:var(--t-xs);color:var(--ink-2);margin-top:var(--s1)}
.streak.pending b{color:var(--ink-2)}
.today{position:relative;width:var(--h-sm);height:var(--h-sm);border-radius:50%;border:2px solid var(--hc);color:var(--hc);display:grid;place-items:center;flex:none;font:var(--t-xs);font-variant-numeric:tabular-nums}
.today svg{width:var(--i-sm);height:var(--i-sm);position:relative}
.today.on{background:var(--hc);color:var(--hc-on)}
.today.off{border-style:dashed;opacity:.6}
.today.rest{border-color:var(--ink-3);color:var(--ink-2)}
.today.multi{border:none;background:conic-gradient(var(--hc) calc(var(--p) * 360deg),var(--surface-2) 0)}
.today.multi::before{content:"";position:absolute;inset:var(--s1);border-radius:50%;background:var(--surface)}
.today.multi.on::before{background:var(--hc)}
.today span{position:relative;color:var(--ink)}
.today.on span{color:var(--hc-on)}
.today small{font-size:9px;opacity:.75}
.mv{display:flex;gap:var(--s2);grid-column:span 2;justify-self:end}
.arch-link{display:flex;justify-content:center;margin-top:var(--s5)}
.arch-link .btn{color:var(--ink-2)}
.lifted{position:relative;z-index:5;transition:none!important;box-shadow:var(--shadow-float);border-radius:var(--r-md)}
.card.lifted{background:var(--surface)}
.tile.lifted{background:var(--bg);outline:var(--s2) solid var(--bg)}
body.dragging{-webkit-user-select:none;user-select:none;cursor:grabbing}
.tile-count .bar{align-self:stretch}
.bar{display:block;height:4px;margin:2px 0;border-radius:2px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hc);border-radius:2px;transition:width var(--base) var(--ease)}
.detail>.bar{height:6px;margin-top:calc(-1 * var(--s3))}
.cd.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--accent)}
.miles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:var(--s2)}
.mile{display:flex;flex-direction:column;gap:2px;padding:var(--s2) var(--s3);border:1px solid var(--line);border-radius:var(--r-md);min-width:0}
.mile b{font:600 17px/1.1 var(--f-display);color:var(--ink-3);font-variant-numeric:tabular-nums}
.mile small{font:var(--t-xs);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mile.on{border-color:color-mix(in srgb,var(--hc) 55%,var(--line))}
.mile.on b{color:var(--ink)}.mile.on small{color:var(--ink-2)}
.mile.next{border-style:dashed}.mile.next b{color:var(--ink-2)}
.mile.new{animation:checkin .4s var(--ease)}
.recap-card{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s2) var(--s2) var(--s4);margin-bottom:var(--s3);border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.recap-t{display:flex;flex-direction:column;flex:1;min-width:0}
.recap-t b{font:var(--t-md);font-weight:600}
.recap-t span{font:var(--t-sm);color:var(--ink-2)}
.recap-stats small{font:var(--t-xs);font-weight:400;color:var(--ink-2)}
.recap-n{font:600 15px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink-2);flex:none}
.srow .sl .strip{margin-top:var(--s1)}
.hidden-note{font:var(--t-sm);color:var(--ink-2);text-align:center;margin-top:var(--s3)}
.link{background:none;border:none;padding:var(--s1);font:var(--t-sm);font-weight:600;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- The chain ---------- */
.s-done{--bgc:var(--hc);--bdc:var(--hc);--fgc:var(--hc-on)}
.s-frozen{--bdc:var(--hc);--bgi:repeating-linear-gradient(135deg,color-mix(in srgb,var(--hc) 55%,transparent) 0 2px,transparent 2px 5px)}
.s-skip{--bdc:var(--ink-3);--bds:dashed;--fgc:var(--ink-2)}
.s-missed{--bdc:var(--line);--bgc:var(--surface-2);--fgc:var(--ink-2)}
.s-due{--bdc:var(--hc)}
.s-partial{--bdc:var(--hc);--bgc:color-mix(in srgb,var(--hc) 30%,transparent)}
.s-off,.s-pre{--bdc:transparent;--fgc:var(--ink-3)}
.s-future{--bds:dotted;--fgc:var(--ink-3)}
.strip{display:flex;gap:5px;margin-top:var(--s2);overflow:hidden}
.d{display:flex;flex-direction:column;align-items:center;gap:var(--s1)}
.d i,.lg{position:relative;display:block;width:16px;height:16px;border-radius:var(--r-xs);border:1.5px var(--bds,solid) var(--bdc,var(--line));background-color:var(--bgc,transparent);background-image:var(--bgi,none)}
.d.s-off i,.d.s-pre i{background-image:radial-gradient(circle,var(--ink-3) 1.6px,transparent 2px)}
.d.s-pre i{opacity:.5}
.d em{font:var(--t-xs);font-size:9.5px;line-height:1;font-style:normal;color:var(--ink-3)}
.d.now em{color:var(--ink)}
.d.jl i::before{content:"";position:absolute;top:50%;right:100%;width:8px;height:4px;margin-top:-2px;background:var(--hc)}
.strip.sm{gap:4px}
.strip.sm .d i{width:12px;height:12px;border-radius:3px}
.strip.sm .d.jl i::before{width:7px;height:3px;margin-top:-1.5px}

/* ---------- Friends ---------- */
.me-card,.join{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.me-card{display:flex;align-items:center;gap:var(--s3);padding:var(--s4)}
.me-t{display:flex;flex-direction:column;min-width:0;flex:1;gap:2px}
.me-t b{font:var(--t-lg)}
.me-t span{font:var(--t-sm);color:var(--ink-2)}
.join{display:flex;flex-direction:column;gap:var(--s4);padding:var(--s5)}
.join h3{font:var(--t-xl);margin-bottom:var(--s1)}
.join p,.muted-note{font:var(--t-sm);color:var(--ink-2)}
.av{position:relative;width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--ink);font:700 16px/1 var(--f-display)}
.av img{width:100%;height:100%;object-fit:cover}
.av.av-lg{width:56px;height:56px;font-size:22px}
.av.av-xl{width:88px;height:88px;font-size:32px}
.fblock{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s3) 0 var(--s4)}
.fblock+.fblock{border-top:1px solid var(--line);padding-top:var(--s4)}
.fhead{display:flex;align-items:center;gap:var(--s3);min-height:var(--h-md);border:none;background:none;padding:0;text-align:left;cursor:pointer;min-width:0;border-radius:var(--r-md)}
.fhead b{font:var(--t-md);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

const LEET={'0':'o','1':'i','3':'e','4':'a','5':'s','7':'t','@':'a','$':'s','!':'i','|':'l'};

function dataBlob(u){const [h,b]=u.split(',');const bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:h.slice(5,h.indexOf(';'))});}

/* ---------- Streak engine ---------- */

  if(e.period){const p=e.period;if(!p.target)return `Rest ${e.unit}`;if(p.count>=p.target)return `Done for the ${e.unit}`;return `${p.count} of ${p.target} this ${e.unit}`;}

/* ---------- Weekly recap ---------- */
function weekStats(ws){
  const we=ws+6,t=today(),end=Math.min(we,t),r={ws,we,hit:0,exp:0,checkins:0,sum:0,longest:null,miles:[],rows:[]};
  for(const h of Object.values(S.habits)){
    if(h.archived||dnOf(h.start)>we)continue;
    const e=evaluate(h,end);let hit=0,exp=0;
    for(let d=ws;d<=end;d++){const k=keyOf(d),n=h.log[k]||0,st=e.st.get(d);r.sum+=n;
      if(e.kind==='counter'){if(n)r.checkins++;continue;}
      if(st==='done')r.checkins++;
      if(e.period)continue;
      const sched=h.kind==='goal'||h.sched.type!=='weekdays'||h.sched.days.includes(dow(d));
      if(st==='done'&&sched){hit++;exp++;}else if(st==='missed'||st==='frozen')exp++;}
    if(e.period&&e.kind!=='counter'&&e.period.target){exp=1;hit=e.period.count>=e.period.target?1:0;if(end<we&&!hit)exp=0;}
    r.hit+=hit;r.exp+=exp;
    if(e.kind!=='counter'&&e.cur&&(!r.longest||e.cur>r.longest.cur))r.longest={h,cur:e.cur,unit:e.unit};
    for(const [m,d] of Object.entries(e.miles))if(d>=ws&&d<=we)r.miles.push({h,e,m:+m,d});
    r.rows.push({h,e,hit,exp,end});
  }
  r.rows.sort((a,b)=>a.h.order-b.h.order);
  r.pct=r.exp?Math.round(r.hit/r.exp*100):null;
  return r;
}

/* ---------- Actions ---------- */
function commit(h){S.habits[h.id]=h;persist(h.id,clean(h));render();refreshSheet();syncPublic();}
function cheer(h,before){
  if(!S.settings.celebrate)return '';
  const a=evaluate(h),n=Object.keys(a.miles).map(Number).filter(m=>!(m in before.miles)).pop();
  if(!n)return '';
  return `Milestone: ${n} ${countLabel(h,a,n)}${a.kind==='counter'?'':' in a row'} · ${nameOf(h)}`;
}
function undoFor(id,k){
  const h=S.habits[id],ln=h.log[k],sk=h.skip[k],st=h.start;
  return ()=>{const x=S.habits[id];if(!x)return;if(ln)x.log[k]=ln;else delete x.log[k];if(sk)x.skip[k]=1;else delete x.skip[k];x.start=st;commit(x);};
}
function addOne(id,again){
  const h=S.habits[id];if(!h||h.archived)return;
  const k=keyOf(today()),pn=h.log[k]||0,ps=!!h.skip[k],before=evaluate(h);
  if(h.kind==='streak'&&h.goal===1&&pn>=1&&!again){fx(id);return toast(`${nameOf(h)}: already done today`,()=>addOne(id,true),false,'Add again');}
  const step=stepOf(h),undo=undoFor(id,k);
  h.log[k]=pn+step;delete h.skip[k];commit(h);
  const n=h.log[k],nm=nameOf(h),ms=cheer(h,before),after=evaluate(h);
  fx(id,step,h.kind!=='counter'&&!before.doneToday&&after.doneToday);
  const msg=h.kind==='counter'?`${nm}: ${amt(h,after.sum)} in all`:after.period&&h.kind==='goal'?`${nm}: ${after.period.count} of ${amt(h,after.period.target)} this week`:
    n>=h.goal&&pn<h.goal?`${nm}: done for today`:h.goal>1?`${nm}: ${n} of ${amt(h,h.goal)}`:`${nm}: ${n} today`;
  toast(ms||msg,undo);
}
function adjust(id,dir,d){
  const h=S.habits[id];if(!h)return;d=d==null||d>today()?today():d;
  const k=keyOf(d),n=Math.max(0,(h.log[k]||0)+dir*stepOf(h)),before=evaluate(h);
  const undo=undoFor(id,k);
  if(n)h.log[k]=n;else delete h.log[k];if(dir>0)delete h.skip[k];
  if(d<dnOf(h.start))h.start=k;
  commit(h);const ms=cheer(h,before),when=d===today()?'today':fmt(d);
  toast(ms||`${nameOf(h)}: ${h.kind==='streak'&&h.goal===1?`${n} ${when}`:`${amt(h,n)} ${when}`}`,undo);
}
function toggleRest(id){
  const h=S.habits[id];if(!h)return;const k=keyOf(today()),undo=undoFor(id,k),was=!!h.skip[k];
  if(was)delete h.skip[k];else{h.skip[k]=1;delete h.log[k];}
  commit(h);toast(was?'Rest day removed':`${nameOf(h)}: rest day today`,undo);
}
function cycleDay(id,d){
  const h=S.habits[id];if(!h||d>today())return;
  const k=keyOf(d),n=h.log[k]||0,before=evaluate(h),undo=undoFor(id,k);
  let now;if(n>=h.goal){delete h.log[k];h.skip[k]=1;now='rest day';}else if(h.skip[k]){delete h.skip[k];now='cleared';}else{h.log[k]=h.goal;delete h.skip[k];now='done';}
  if(d<dnOf(h.start))h.start=k;
  commit(h);const big=cheer(h,before);toast(big||`${fmt(d)}: ${now}`,undo,!!big);
}
function archive(id,v){

  if(v){if(ui.sheet&&ui.sheet.kind==='detail')closeSheet();toast(`Archived ${nameOf(h)}`,()=>archive(id,false));}
  else if(ui.sheet&&['settings','archived'].includes(ui.sheet.kind))renderSheet();
}
function removeHabit(id,fromSettings){

}
function move(id,dir){

  const peers=S.settings.groups?act.filter(x=>x.group.trim()===h.group.trim()):act,i=peers.indexOf(h),j=i+dir;

function dragEnd(){

function dragEnd2(ids,slots){

    let r;try{r=await sb.auth.getSession();}catch(e){return;}
    const ss=r&&r.data&&r.data.session;
    if(!ss&&r&&netErr(r.error))return;
    clearInterval(waitT);removeEventListener('online',go);waitT=null;
    if(ss)useAccount(ss);else signedOut();
  };
  waitT=setInterval(go,15000);addEventListener('online',go);
}
// The login ran out on this phone: ask to log in again and keep everything saved here.
function signedOut(){
  if(store.unsub){try{store.unsub();}catch(e){}store.unsub=null;}
  for(const t of W.timers.values())clearTimeout(t);W.timers.clear();
  store.mode='offline';store.ready=false;saveLocal();if(ui.sheet)closeSheet();render();
  A.mode='login';A.email=acct?acct.email:A.email;A.err='';
  A.info=W.pending.size?"You've been logged out on this phone. Log in again to sync. Your latest changes are kept here until you do.":"You've been logged out on this phone. Log in again to see your streaks.";
  showAuth();
}
function authHTML(){
  const su=A.mode==='signup',p=A.pw;
  return `<div class="auth-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <div class="brand"><svg class="mark" viewBox="0 0 100 93" width="26" height="24" aria-hidden="true"><path class="star" fill="currentColor" d="M50 0Q52.6 16.4 65.6 19.1Q52.6 21.8 50 38Q47.4 21.8 34.4 19.1Q47.4 16.4 50 0Z"/><path fill="currentColor" d="M0 23.9H16.3L50.1 61L87.4 23.9H100Q92.6 29.6 91.8 37.6V80.3Q92.6 88 100 92.8H69.6Q77.6 88.4 78.3 80.3V42.7L47.7 78.1L18.2 46V80.3Q18.9 88.4 28.2 92.8H0Q9.4 88 10 80.3V37.6Q9.4 29.6 0 23.9Z"/></svg><h1>Motif</h1></div>
    <h2 id="authTitle" class="headline">${su?'Create your account':'Welcome back'}</h2>
    <div class="tabs" role="tablist"><button role="tab" data-act="authMode" data-v="login" aria-selected="${!su}">Log in</button><button role="tab" data-act="authMode" data-v="signup" aria-selected="${su}">Create account</button></div>
    <form class="form" id="authForm" novalidate>
      <div class="field"><label class="lab" for="a-email">Email</label><input id="a-email" type="email" autocomplete="email" inputmode="email" value="${esc(A.email)}" placeholder="you@example.com"></div>
      <div class="field"><label class="lab" for="a-pw">Password</label><div class="pw-row"><input id="a-pw" type="${A.show?'text':'password'}" autocomplete="${['current-password','new-password'][+su]}" value="${esc(A.pw)}"><button type="button" class="link" data-act="authShow">${A.show?'Hide':'Show'}</button></div>
        ${su?`<ul class="pw-rules" id="pwRules">${PWRULES.map(([l,f])=>`<li class="${f(p)?'ok':''}">${f(p)?I.check:'<i></i>'}${l}</li>`).join('')}</ul>`:''}</div>
      ${su?`<div class="field"><label class="lab" for="a-pw2">Type it again</label><input id="a-pw2" type="${A.show?'text':'password'}" autocomplete="new-password" value="${esc(A.pw2)}"></div>`:''}
      ${A.info&&!A.err?`<p class="hint" role="status">${esc(A.info)}</p>`:''}${A.err?`<p class="err" role="alert">${esc(A.err)}</p>`:''}
      <button class="btn primary" type="submit"${A.busy?' disabled':''}>${A.busy?'One moment…':su?'Create account':'Log in'}</button>
    </form>
  </div>`;
}
function showAuth(){const el=$('#auth');el.innerHTML=authHTML();el.hidden=false;document.body.classList.add('locked','signin');}
function authError(e){
  const c=e&&(e.code||e.error_code),m=String((e&&e.message)||'');
  if(c==='invalid_credentials')return 'That email and password don\'t match. Check them and try again.';
  if(c==='user_already_exists'||/already registered/i.test(m))return 'That email already has an account. Log in instead.';
  if(c==='weak_password')return 'That password doesn\'t meet all the rules below.';
  if(c==='email_address_invalid'||/invalid.*email|email.*invalid/i.test(m))return 'That email address doesn\'t look right.';
  if(c==='over_request_rate_limit'||e&&e.status===429)return 'Too many tries. Wait a few minutes and try again.';
  if(/most (Motif|Unbroken) accounts/i.test(m))return m+' Log in to one of them instead.';
  return 'Something went wrong. Check your connection and try again.';
}
async function submitAuth(){
  const su=A.mode==='signup';A.email=A.email.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(A.email)){A.err='Enter your email address.';return showAuth();}
  if(su&&!PWRULES.every(([,f])=>f(A.pw))){A.err='Your password needs everything in the list below.';return showAuth();}
  if(su&&A.pw!==A.pw2){A.err='The two passwords don\'t match.';return showAuth();}
  if(!A.pw){A.err='Enter your password.';return showAuth();}
  A.busy=true;A.err='';showAuth();
  try{
    const {data,error}=su?await sb.auth.signUp({email:A.email,password:A.pw}):await sb.auth.signInWithPassword({email:A.email,password:A.pw});
    if(error)throw error;
    if(!data.session)throw {message:'no session'};
    A.pw=A.pw2='';A.busy=false;A.info='';
    if(acct){try{localStorage.setItem(ACCT,JSON.stringify({id:data.session.user.id,email:data.session.user.email}));}catch(e){}return location.reload();}
    useAccount(data.session);
  }catch(e){A.busy=false;A.err=authError(e);showAuth();}
}
async function logOut(){
  if(W.pending.size||W.inflight.size){if(store.mode==='cloud'&&store.ready){toast('Saving your latest changes first. Try again in a moment.');retryAll();}else toast("Some changes haven't synced yet. Reconnect first so they aren't lost.");return;}
  ui.leavingAcct=true;
  try{await sb.auth.signOut();}catch(e){}
  try{localStorage.removeItem(KEY);localStorage.removeItem(ACCT);}catch(e){}
  location.reload();
}
async function startAccounts(){
  document.addEventListener('submit',e=>{if(e.target.id==='authForm'){e.preventDefault();submitAuth();}});
  document.addEventListener('input',e=>{const t=e.target;if(!t.closest||!t.closest('#auth'))return;
    if(t.id==='a-email')A.email=t.value;if(t.id==='a-pw2')A.pw2=t.value;
    if(t.id==='a-pw'){A.pw=t.value;const r=$('#pwRules');if(r)r.innerHTML=PWRULES.map(([l,f])=>`<li class="${f(A.pw)?'ok':''}">${f(A.pw)?I.check:'<i></i>'}${l}</li>`).join('');}});
  document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('#auth [data-act]');if(!b)return;
    if(b.dataset.act==='authMode'){A.mode=b.dataset.v;A.err='';showAuth();}
    if(b.dataset.act==='authShow'){A.show=!A.show;showAuth();}});
  render();
  const last=lastAcct();
  if(last)openAccount(last);
  if(!client()){if(last){store.mode='offline';render();}else{A.info="Motif can't connect right now. You can log in once you're back online.";showAuth();}return waitOnline();}
  let r=null;const slow=last?setTimeout(()=>{if(store.mode==='connecting'){store.mode='offline';render();}},6000):0;
  try{r=await sb.auth.getSession();}catch(e){r={error:e};}clearTimeout(slow);
  const ss=r&&r.data&&r.data.session;
  if(ss)return useAccount(ss);
  if(last&&netErr(r&&r.error)){store.mode='offline';render();return waitOnline();}
  if(last)return signedOut();
  showAuth();
}

/* ---------- Start ---------- */
if(!(window.claude&&window.claude.use)&&'serviceWorker' in navigator&&/^(https:|http:\/\/localhost[:/])/.test(location.href))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(ACCOUNTS)startAccounts();
else{ui.hadCache=loadLocal();render();connect();}
})();
</script>
