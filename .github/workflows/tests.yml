name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Some tests compare with the previous app version kept on this branch.
      - run: git branch backup/before-reliability-fixes origin/backup/before-reliability-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g playwright@1 && npx playwright install --with-deps chromium
      - run: sh tests/run.sh
